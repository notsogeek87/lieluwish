name: Release APK

on:
  push:
    branches: [main, staging]
  workflow_dispatch:

permissions:
  contents: write # nécessaire pour publier la release

concurrency:
  group: release-apk-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BRICKSET_API_KEY: ${{ secrets.BRICKSET_API_KEY }}
      REBRICKABLE_API_KEY: ${{ secrets.REBRICKABLE_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Le SDK Android est préinstallé sur ubuntu-latest ; on accepte juste les licences.
      - name: Accepter les licences du SDK Android
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4

      # Keystore optionnelle : sans secret, l'APK est signé avec la clé de debug.
      - name: Décoder la keystore de release
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "RELEASE_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::RELEASE_KEYSTORE_BASE64 absent : APK signé avec une clé de debug éphémère (pas de mise à jour possible par-dessus la version précédente)."
          fi

      - name: Build APK release
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Renommer l'APK en release.<branche>.apk
        run: cp app/build/outputs/apk/release/app-release.apk "release.${GITHUB_REF_NAME}.apk"

      # On garde aussi l'APK en artifact du run (pratique pour débugger).
      - uses: actions/upload-artifact@v4
        with:
          name: release.${{ github.ref_name }}
          path: release.${{ github.ref_name }}.apk
          if-no-files-found: error

      # Une release par build, visible à la racine du dépôt (colonne "Releases").
      # main = release normale ; staging = pré-release.
      - name: Publier la GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}-${GITHUB_RUN_NUMBER}"
          FLAGS=""
          if [ "$GITHUB_REF_NAME" != "main" ]; then FLAGS="--prerelease"; fi
          gh release create "$TAG" "release.${GITHUB_REF_NAME}.apk" \
            --target "$GITHUB_SHA" \
            --title "release.${GITHUB_REF_NAME} #${GITHUB_RUN_NUMBER}" \
            --notes "APK ${GITHUB_REF_NAME} - commit ${GITHUB_SHA::7}" \
            $FLAGS
