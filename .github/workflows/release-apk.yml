name: Release APK

on:
  push:
    branches: [main, staging, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write # nécessaire pour publier la release

concurrency:
  group: release-apk-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # versionCode = run_number, versionName = <appVersionBase>.<run_number>, tag = v<versionName>.
      BUILD_NUMBER: ${{ github.run_number }}
      BRICKSET_API_KEY: ${{ secrets.BRICKSET_API_KEY }}
      REBRICKABLE_API_KEY: ${{ secrets.REBRICKABLE_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Le SDK Android est préinstallé sur ubuntu-latest ; on accepte juste les licences.
      - name: Accepter les licences du SDK Android
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4

      # Keystore optionnelle : sans secret, l'APK est signé avec la clé de debug.
      - name: Décoder la keystore de release
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "RELEASE_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::RELEASE_KEYSTORE_BASE64 absent : APK signé avec une clé de debug éphémère (pas de mise à jour possible par-dessus la version précédente)."
          fi

      - name: Calculer la version
        run: |
          BASE=$(grep '^appVersionBase=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          echo "APP_VERSION=${BASE}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      # Build + lint : doivent être verts sur la branche de travail avant tout merge vers main/staging.
      - name: Build APK release + lint
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease lintRelease --no-daemon

      - name: Renommer l'APK en NinjagoWishlist-<version>.apk
        run: cp app/build/outputs/apk/release/app-release.apk "NinjagoWishlist-${APP_VERSION}.apk"

      # On garde aussi l'APK en artifact du run (pratique pour débugger).
      - uses: actions/upload-artifact@v4
        with:
          name: NinjagoWishlist-${{ env.APP_VERSION }}
          path: NinjagoWishlist-${{ env.APP_VERSION }}.apk
          if-no-files-found: error

      # Une release par build sur main/staging (pas sur les branches de travail).
      # main = release normale (celle que lit la mise à jour automatique : /releases/latest) ;
      # staging = pré-release, ignorée par /releases/latest.
      - name: Publier la GitHub Release
        if: github.ref_name == 'main' || github.ref_name == 'staging'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${APP_VERSION}"
          FLAGS=""
          if [ "$GITHUB_REF_NAME" != "main" ]; then FLAGS="--prerelease"; fi
          cat > release-notes.md <<EOF
          ## Ninjago Wishlist ${APP_VERSION}

          Commit ${GITHUB_SHA::7} (branche ${GITHUB_REF_NAME}).

          ### Vous avez déjà l'application ?
          Ouvrez-la : elle vérifie les mises à jour à chaque ouverture. Touchez **Installer**, autorisez
          l'installation d'applications inconnues si Android le demande (puis revenez en arrière), et
          confirmez avec **Mettre à jour**. Vos données sont conservées.
          (Vous pouvez aussi aller dans **Paramètres → Rechercher une mise à jour**.)

          ### Première installation (manuelle)
          1. Téléchargez \`NinjagoWishlist-${APP_VERSION}.apk\` ci-dessous (section *Assets*) sur votre téléphone.
          2. Ouvrez le fichier téléchargé.
          3. Si Android bloque l'installation, autorisez la source (navigateur ou gestionnaire de fichiers) quand il vous le propose, puis revenez en arrière.
          4. Touchez **Installer**.

          Les versions suivantes seront proposées automatiquement à l'ouverture de l'application.
          EOF
          gh release create "$TAG" "NinjagoWishlist-${APP_VERSION}.apk" \
            --target "$GITHUB_SHA" \
            --title "Ninjago Wishlist ${APP_VERSION}" \
            --notes-file release-notes.md \
            $FLAGS
